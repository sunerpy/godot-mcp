version: 2

updates:
  # Every direct crate is pinned with `=` in the workspace manifest, so an update
  # is a deliberate, reviewed change to that baseline; one grouped PR a week at
  # most, and stale branches are not rebased after every merge.
  - package-ecosystem: cargo
    directory: /
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
