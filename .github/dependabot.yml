version: 2

updates:
  # Every direct crate is pinned with `=` in the workspace manifest, so an update
  # is a deliberate, reviewed change to that baseline. Patch releases arrive as
  # one grouped PR; every minor or major release opens on its own, because a
  # 0.x minor is a breaking change and each needs its own migration. Stale
  # branches are not rebased after every merge.
  - package-ecosystem: cargo
    directory: /
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    # Minor and patch releases of the pinned Actions arrive together; a major
    # release opens on its own so its migration notes are read first.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
