# CI: every required release-gate check, observed and judged in one run.
#
# The checks and their exact commands come from the release-gate catalogue
# (`make release-gate-specs`), which derives every Godot version, URL and digest
# from tests/fixtures/godot-releases.lock.json. No job here names a version, a URL
# or a digest: the `matrix` job derives them once and every other job reads its
# outputs. A copied value would be a lie the lock could not correct, and
# `ci_matrix_lock::ci_matrix_lock_happy_path` fails the build if one appears.
#
# Each check runs through scripts/ci-observe.sh, which looks its command up by
# name, runs it, and records the command, the exit code, the runner and the
# candidate commit as an observation. The `release-gates` job joins every
# observation of this run to the catalogue with the frozen harness
# (`make release-gates-harness QUALIFYING=0`); it fails when any required check
# is missing, skipped, unavailable, bound to another command or nonzero. CI
# Success then requires that job and the native test legs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  matrix:
    name: Derive the catalogue from the lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      engine_editor: ${{ steps.derive.outputs.engine_editor }}
      packaged_smoke: ${{ steps.derive.outputs.packaged_smoke }}
      linux_editor: ${{ steps.derive.outputs.linux_editor }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Derive the matrices and the catalogue
        id: derive
        run: |
          set -euo pipefail
          mkdir -p ci-catalogue
          make -s ci-matrix > ci-catalogue/matrix.json
          make -s release-gate-specs > ci-catalogue/release-gate-specs.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          document = json.load(open("ci-catalogue/matrix.json", encoding="utf-8"))
          for key in ("engine_editor", "packaged_smoke"):
              print(f"{key}=" + json.dumps(document[key], separators=(",", ":")))
          # The packaged-smoke rows are the newest locked release; its Linux editor
          # runs the GDScript codec harness and the display smoke.
          linux = [row for row in document["packaged_smoke"] if row["platform"] == "linux-x86_64"]
          if len(linux) != 1:
              raise SystemExit(f"expected exactly one Linux packaged-smoke row, found {len(linux)}")
          print("linux_editor=" + json.dumps(linux[0], separators=(",", ":")))
          PY
          python3 -c 'import json; print(len(json.load(open("ci-catalogue/release-gate-specs.json"))["checks"]), "checks in the catalogue")'

      - name: Upload the catalogue
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-catalogue
          path: ci-catalogue/
          if-no-files-found: error
          retention-days: 7

  # The catalogue checks that need no external environment, one job each so a red
  # check names itself and the rest still run.
  gates:
    name: ${{ matrix.check }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        check:
          - format
          - lint
          - unit
          - contract
          - golden
          - build-locked
          - license
          - advisory
          - sbom
          - release-graph-audit
          - reproducibility
          - deployment-smoke-oidc-local-jwks
    env:
      CHECK: ${{ matrix.check }}
      # Two clean builds served from a compiler cache would be byte-identical by
      # construction, so the reproducibility check compiles without one.
      RUSTC_WRAPPER: ${{ matrix.check != 'reproducibility' && 'sccache' || '' }}
      SCCACHE_GHA_ENABLED: ${{ matrix.check != 'reproducibility' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
          targets: ${{ matrix.check == 'reproducibility' && 'x86_64-unknown-linux-musl' || '' }}

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        if: matrix.check != 'reproducibility'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Download the catalogue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-catalogue
          path: ci-catalogue

      # Versions come from tooling.lock.json, which records the exact pin and the
      # crates.io package it was installed from. The unit check needs them too:
      # its tooling_lock suite validates the lock against the installed executables.
      - name: Install the locked cargo subcommands
        if: matrix.check == 'license' || matrix.check == 'advisory' || matrix.check == 'sbom' || matrix.check == 'unit'
        run: |
          set -euo pipefail
          deny=$(python3 -c 'import json;print(json.load(open("tooling.lock.json"))["tools"]["cargo-deny"]["version"])')
          cyclonedx=$(python3 -c 'import json;print(json.load(open("tooling.lock.json"))["tools"]["cargo-cyclonedx"]["version"])')
          cargo +1.96.0 install cargo-deny --version "$deny" --locked
          cargo +1.96.0 install cargo-cyclonedx --version "$cyclonedx" --locked

      - name: Install the Linux musl release toolchain
        if: matrix.check == 'reproducibility'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Restore the locked Linux Godot editor
        if: matrix.check == 'golden'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/godot-mcp/godot-artifacts/${{ fromJSON(needs.matrix.outputs.linux_editor).sha256 }}
          key: godot-artifact-${{ fromJSON(needs.matrix.outputs.linux_editor).sha256 }}

      # The golden check runs the bridge protocol suite, whose real GDScript codec
      # harness needs an engine; without one it reports SKIP. It gets the locked
      # Linux editor so the harness executes. The variable is set for this check
      # only: `godot-mcp` reads it from the environment, so a workspace-wide run
      # with it set would change what the CLI suites observe.
      - name: Provide the locked Linux Godot editor to the codec harness
        if: matrix.check == 'golden'
        env:
          EDITOR: ${{ needs.matrix.outputs.linux_editor }}
        run: |
          set -euo pipefail
          url=$(jq -r .download_url <<<"$EDITOR")
          sha=$(jq -r .sha256 <<<"$EDITOR")
          name=$(jq -r .artifact_name <<<"$EDITOR")
          artifact=$(scripts/godot-artifact.sh --url "$url" --sha256 "$sha" --name "$name")
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q -o "$artifact" -d "$RUNNER_TEMP/godot"
          binary="$RUNNER_TEMP/godot/${name%.zip}"
          test -x "$binary" || { echo "::error::the locked editor archive did not contain ${name%.zip}"; exit 1; }
          echo "GODOT_MCP_GODOT_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Run the check
        env:
          RELEASE_GATE_SPECS: ${{ github.workspace }}/ci-catalogue/release-gate-specs.json
        run: |
          set -euo pipefail
          scripts/ci-observe.sh "$CHECK" 2>&1 | tee "$RUNNER_TEMP/check.log"

      # The catalogue's format check is rustfmt. The repository's own Markdown,
      # YAML and JSON (the top level and .github/; .oxfmtignore keeps oxfmt out of
      # the byte-pinned trees) are checked here, at the version the Makefile pins.
      - name: Setup Node for oxfmt
        if: matrix.check == 'format'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check the repository's other formatting
        if: matrix.check == 'format'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^OXFMT_VERSION := //p' Makefile)
          test -n "$version" || { echo "::error::the Makefile pins no OXFMT_VERSION"; exit 1; }
          npm install --global "oxfmt@${version}"
          oxfmt --check --no-error-on-unmatched-pattern --ignore-path .oxfmtignore .

      # The harness prints its SKIP line straight to stderr, past libtest's
      # capture, so its absence from the log means it ran.
      - name: Require the codec harness to have executed
        if: matrix.check == 'golden'
        run: |
          set -euo pipefail
          if grep -F 'SKIP real GDScript codec harness' "$RUNNER_TEMP/check.log"; then
            echo "::error::the GDScript codec harness was skipped although the locked editor was provided"
            exit 1
          fi

      - name: Upload the observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation-${{ matrix.check }}
          path: ci/observations/
          if-no-files-found: error
          retention-days: 7

  # Linux engine/export-template matrix over every exact patch release in the
  # lock. The job name carries the exact version because it came from the matrix
  # row; this file never spells one.
  engine:
    name: godot ${{ matrix.entry.version }} ${{ matrix.entry.platform }} ${{ matrix.entry.artifact_kind }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.matrix.outputs.engine_editor) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Download the catalogue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-catalogue
          path: ci-catalogue

      # The cache key IS the locked digest, so a hit can only be the exact verified
      # bytes. Export templates are over a gigabyte each and download faster than
      # the cache restores them, so only the editors are cached.
      - name: Restore the digest-keyed Godot artifact cache
        if: matrix.entry.artifact_kind == 'editor'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/godot-mcp/godot-artifacts/${{ matrix.entry.sha256 }}
          key: godot-artifact-${{ matrix.entry.sha256 }}

      - name: Run the compatibility suite against the locked artifact
        env:
          ARTIFACT_KIND: ${{ matrix.entry.artifact_kind }}
          VERSION: ${{ matrix.entry.version }}
          RELEASE_GATE_SPECS: ${{ github.workspace }}/ci-catalogue/release-gate-specs.json
        run: |
          set -euo pipefail
          scope=linux-editor
          if [ "$ARTIFACT_KIND" != "editor" ]; then
            scope=export-templates
          fi
          scripts/ci-observe.sh "godot-matrix-${scope}-${VERSION}"

      - name: Upload the observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation-godot-${{ matrix.entry.version }}-${{ matrix.entry.artifact_kind }}
          path: ci/observations/
          if-no-files-found: error
          retention-days: 7

  # The catalogue's display check runs the locked-artifact check against the
  # newest locked Linux editor with GODOT_DISPLAY_REQUIRED=1, which also runs the
  # editor windowed and requires it to report a display server and render. It
  # runs under a virtual X server; hosted runners have no GPU, so rendering is
  # Mesa's software rasterizer.
  display:
    name: display editor smoke
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Download the catalogue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-catalogue
          path: ci-catalogue

      - name: Install a virtual display and the software renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers

      - name: Restore the digest-keyed Godot artifact cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/godot-mcp/godot-artifacts/${{ fromJSON(needs.matrix.outputs.linux_editor).sha256 }}
          key: godot-artifact-${{ fromJSON(needs.matrix.outputs.linux_editor).sha256 }}

      - name: Run the display check on a virtual display
        env:
          VERSION: ${{ fromJSON(needs.matrix.outputs.linux_editor).version }}
          RELEASE_GATE_SPECS: ${{ github.workspace }}/ci-catalogue/release-gate-specs.json
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/ci-observe.sh "gpu-display-editor-${VERSION}"

      - name: Upload the observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation-display
          path: ci/observations/
          if-no-files-found: error
          retention-days: 7

  # Each platform builds its own publishable archive with `make dist`, then runs
  # the archive's executables against the newest locked Godot build for that
  # platform. The Linux leg also runs the Docker clean-room isolation check over
  # the same archive set.
  packaged-smoke:
    name: packaged smoke ${{ matrix.entry.platform }}
    needs: matrix
    runs-on: ${{ matrix.entry.platform == 'linux-x86_64' && 'ubuntu-24.04' || matrix.entry.platform == 'macos-universal' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.matrix.outputs.packaged_smoke) }}
    defaults:
      run:
        shell: bash
    env:
      # alpine 3.22.2 (amd64), pinned by digest: scripts/isolation-smoke.sh
      # rejects a tag, and a tag would let the clean room drift.
      RELEASE_GATES_ISOLATION_IMAGE: alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0
          targets: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-musl' || '' }}

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install the Linux musl release toolchain
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Download the catalogue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-catalogue
          path: ci-catalogue

      - name: Build the publishable archive for this platform
        run: make dist

      - name: Restore the digest-keyed Godot artifact cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/godot-mcp/godot-artifacts/${{ matrix.entry.sha256 }}
          key: godot-artifact-${{ matrix.entry.sha256 }}

      - name: Smoke the packaged binary against the locked Godot build
        env:
          PLATFORM: ${{ matrix.entry.platform }}
          VERSION: ${{ matrix.entry.version }}
          RELEASE_GATES_ARCHIVES_DIR: target/release-dist
          RELEASE_GATE_SPECS: ${{ github.workspace }}/ci-catalogue/release-gate-specs.json
        run: scripts/ci-observe.sh "packaged-smoke-${PLATFORM}-${VERSION}"

      # The release installer against this archive, served from a local copy
      # laid out the way a GitHub release serves it.
      - name: Install the archive with the release installer
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          base="$RUNNER_TEMP/releases"
          mkdir -p "$base/v$version"
          cp target/release-dist/godot-mcp-"$version"-*.tar.gz target/release-dist/SHA256SUMS.txt "$base/v$version/"
          GODOTMCP_VERSION="v$version" GODOTMCP_DOWNLOAD_BASE="file://$base" \
            GODOTMCP_INSTALL_ROOT="$RUNNER_TEMP/install" GODOTMCP_BIN_DIR="$RUNNER_TEMP/bin" \
            sh scripts/install.sh
          "$RUNNER_TEMP/bin/godot-mcp" --version

      - name: Run the Docker clean-room isolation check
        if: runner.os == 'Linux'
        env:
          RELEASE_GATE_SPECS: ${{ github.workspace }}/ci-catalogue/release-gate-specs.json
        run: scripts/ci-observe.sh isolation-docker-clean-room

      - name: Upload the observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation-packaged-smoke-${{ matrix.entry.platform }}
          path: ci/observations/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the archive set
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.entry.platform }}
          path: target/release-dist/
          if-no-files-found: error
          retention-days: 7

  # The whole workspace suite on the two platforms the catalogue's workspace
  # checks do not run on. Process boundaries, Job Objects and the macOS window
  # server are exercised here and nowhere else in CI.
  native-tests:
    name: tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: "off"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Parse the PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

      # macOS's default TMPDIR sits under /var, a symlink to /private/var, and the
      # project filesystem refuses a path with a symlink in it, so the suites that
      # build projects in a temporary directory get one without.
      - name: Use a temporary directory without symlinks
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # Every suite runs, so one platform difference does not hide the next.
      - name: Run the workspace tests
        run: cargo +1.96.0 test --workspace --all-features --locked --no-fail-fast

  # Informational, so it is left out of CI Success on purpose: the floor in the
  # Makefile was measured on a host that runs every isolation suite, and a hosted
  # runner that skips some of them measures a different denominator. The gate
  # still fails this job below the floor, and the report is kept as an artifact.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Instrumented builds bypass the compiler cache.
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov@0.8.7

      # The coverage run includes the tooling_lock suite, which validates the
      # locked cargo subcommands against the installed executables.
      - name: Install the locked cargo subcommands
        run: |
          set -euo pipefail
          deny=$(python3 -c 'import json;print(json.load(open("tooling.lock.json"))["tools"]["cargo-deny"]["version"])')
          cyclonedx=$(python3 -c 'import json;print(json.load(open("tooling.lock.json"))["tools"]["cargo-cyclonedx"]["version"])')
          cargo +1.96.0 install cargo-deny --version "$deny" --locked
          cargo +1.96.0 install cargo-cyclonedx --version "$cyclonedx" --locked

      - name: Run the coverage gate
        run: make coverage-gate

      # Reporting, not gating: without a CODECOV_TOKEN, or during a Codecov
      # outage, the upload does nothing and the job stays as the gate left it.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage-report/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/coverage-report/
          if-no-files-found: warn
          retention-days: 7

  # Joins this run's observations to the catalogue. It runs even when a check
  # failed, so the report names every failure, and it fails unless all of them
  # passed. It writes a non-qualifying document only: the qualifying emission is
  # refused without its producer-owned orchestration context.
  release-gates:
    name: release gates
    needs: [matrix, gates, engine, display, packaged-smoke]
    if: always() && needs.matrix.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Download every observation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: observation-*
          path: downloaded/observations
          merge-multiple: true

      - name: Download every archive set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: downloaded/dist

      - name: Assemble the observations and the archive set
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p ci/observations
          # A check whose job never uploaded anything is reported by the harness as
          # missing, so an empty download is not an error here.
          observations=(downloaded/observations/*.json)
          if ((${#observations[@]} > 0)); then
            cp "${observations[@]}" ci/observations/
          fi
          ls -1 ci/observations
          # Each platform's dist carries its own archive and a SHA256SUMS.txt naming
          # it; the harness reads one manifest over every archive it is bound to.
          dists=(downloaded/dist/*/)
          if ((${#dists[@]} > 0)); then
            scripts/assemble-dist.sh --allow-incomplete release-gates/archives "${dists[@]}"
          fi

      - name: Run the frozen harness, non-qualifying
        run: |
          set -euo pipefail
          make release-gates-harness \
            CANDIDATE_WORKTREE=. \
            SOURCE_COMMIT="$GITHUB_SHA" \
            SOURCE_TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")" \
            ARCHIVES_DIR=release-gates/archives \
            OUTPUT=release-gates/release-gates.json \
            OUTPUT_SHA=release-gates/release-gates.sha256 \
            QUALIFYING=0

      - name: Upload the gates document
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gates-non-qualifying
          path: |
            release-gates/release-gates.json
            release-gates/release-gates.sha256
            release-gates/archives/SHA256SUMS.txt
            ci/observations/
          if-no-files-found: warn
          retention-days: 30

  # `coverage` is the one job left out, as its comment says.
  ci-success:
    name: CI Success
    needs: [matrix, gates, engine, display, packaged-smoke, native-tests, release-gates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ -z "${NEEDS_JSON:-}" ]; then
            echo "::error title=CI gate::the needs context was empty; failing closed"
            exit 1
          fi
          if ! printf '%s' "$NEEDS_JSON" | jq -e 'type == "object" and length > 0' >/dev/null 2>&1; then
            echo "::error title=CI gate::the needs context was not a non-empty object; failing closed"
            exit 1
          fi
          mapfile -t rows < <(
            printf '%s' "$NEEDS_JSON" \
              | jq -r 'to_entries | sort_by(.key)[] | "\(.key)\t\(.value.result // "<missing>")"'
          )
          ((${#rows[@]} > 0)) || { echo "::error title=CI gate::no required jobs found"; exit 1; }
          offenders=0
          for row in "${rows[@]}"; do
            job="${row%%$'\t'*}"
            result="${row#*$'\t'}"
            if [ "$result" = success ]; then
              printf '  OK   %-20s %s\n' "$job" "$result"
            else
              printf '  FAIL %-20s %s\n' "$job" "$result"
              echo "::error title=CI gate::required job '${job}' concluded '${result}', not 'success'"
              offenders=$((offenders + 1))
            fi
          done
          if [ "$offenders" -ne 0 ]; then
            echo "CI failed: ${offenders} of ${#rows[@]} required job(s) did not conclude 'success'."
            exit 1
          fi
          echo "CI passed: all ${#rows[@]} required job(s) concluded 'success'."
