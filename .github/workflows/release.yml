# Same-run release: release-please owns the version, the tag and a draft GitHub
# Release; every later job runs downstream in this run. Nothing here builds from a
# ref other than the release tag, and nothing publishes before every archive has
# been built, smoke-tested on its own platform, attested and verified remotely.
#
#   release-please   opens or updates the release PR; on its merge, tags the
#                    release commit and creates the draft
#   verify-ci        waits for CI Success on the exact release commit: the whole
#                    release-gate catalogue, judged by the harness, plus the
#                    native test legs
#   build            one leg per published target: `make dist` on that platform,
#                    then the catalogue's packaged smoke against the locked Godot
#                    build, run on the archive that is about to be published
#   upload-assets    merges the legs (scripts/assemble-dist.sh), attests the
#                    archives, attaches them and verifies the remote bytes; it is
#                    the only job holding id-token and runs no project code
#   publish-release  re-verifies the draft and flips it to public
#
# Requires .github/scripts/resolve-release-gate.sh and
# .github/scripts/publish-release-draft.sh.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing draft release tag to rebuild, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build_artifacts: ${{ steps.gate.outputs.build_artifacts }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release gate
        id: gate
        shell: bash
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REPO: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
        run: bash .github/scripts/resolve-release-gate.sh

  # CI on the exact release commit is the release's verification: it observes
  # every catalogue check and the harness judges them. Rerunning that suite here
  # would only repeat it.
  verify-ci:
    name: Verify CI Passed
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI Success on the exact release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.release-please.outputs.release_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The push that created the tag starts CI in the same moment; wait,
          # bounded, until its run is listed.
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=push&branch=main&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | .id // empty')
            [ -z "$run_id" ] || break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error title=Release CI::no CI push run found for ${HEAD_SHA}"
            exit 1
          fi
          # Blocks until the run completes. Its own conclusion also counts the
          # informational coverage job, so the verdict is CI Success's alone.
          gh run watch "$run_id" --repo "$REPO" --interval 30 >/dev/null || true
          conclusion=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "CI Success")] | last | .conclusion // empty')
          if [ "$conclusion" != success ]; then
            echo "::error title=Release CI::CI Success concluded '${conclusion:-<missing>}' for ${HEAD_SHA} (run ${run_id})"
            exit 1
          fi
          echo "CI Success passed for the exact release commit ${HEAD_SHA} (run ${run_id})."

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Build legs execute build scripts and dependency code, so they hold no
    # id-token or attestations permission; upload-assets attests the archives.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            smoke_platform: linux-x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            smoke_platform: macos-universal
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            smoke_platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Require the tag to resolve to the release commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error title=Release build::checked-out tag differs from the release commit"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache Rust inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          key: ${{ matrix.target }}
          cache-targets: false
          cache-workspace-crates: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install the Linux musl release toolchain
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Build the publishable archive
        run: make dist

      - name: Require the archive this leg publishes
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          extension=tar.gz
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            extension=zip
          fi
          archive="godot-mcp-${VERSION}-${TARGET}.${extension}"
          test -f "target/release-dist/${archive}" \
            || { echo "::error title=Release build::make dist did not produce ${archive}"; exit 1; }
          grep -F "  ${archive}" target/release-dist/SHA256SUMS.txt >/dev/null \
            || { echo "::error title=Release build::SHA256SUMS.txt does not name ${archive}"; exit 1; }

      # The catalogue's own packaged-smoke command, run on the archive this leg
      # is about to upload, against the newest locked Godot build for its
      # platform. ci-observe.sh looks the command up by name, so the version and
      # the Godot URL come from the lock, not from this file.
      - name: Smoke the packaged binary against the locked Godot build
        env:
          SMOKE_PLATFORM: ${{ matrix.smoke_platform }}
          SOURCE_COMMIT: ${{ needs.release-please.outputs.release_sha }}
          RELEASE_GATES_ARCHIVES_DIR: target/release-dist
        run: |
          set -euo pipefail
          make -s ci-matrix > "$RUNNER_TEMP/matrix.json"
          version=$(SMOKE_PLATFORM="$SMOKE_PLATFORM" python3 - "$RUNNER_TEMP/matrix.json" <<'PY'
          import json, os, sys
          rows = [row for row in json.load(open(sys.argv[1], encoding="utf-8"))["packaged_smoke"]
                  if row["platform"] == os.environ["SMOKE_PLATFORM"]]
          if len(rows) != 1:
              raise SystemExit(f"expected one packaged-smoke row for {os.environ['SMOKE_PLATFORM']}, found {len(rows)}")
          print(rows[0]["version"])
          PY
          )
          scripts/ci-observe.sh "packaged-smoke-${SMOKE_PLATFORM}-${version}"

      - name: Name the provenance document after its target
        env:
          TARGET: ${{ matrix.target }}
        run: mv target/release-dist/provenance.json "target/release-dist/provenance-${TARGET}.json"

      - name: Upload the smoked archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/release-dist/*.tar.gz
            target/release-dist/*.zip
            target/release-dist/SHA256SUMS.txt
            target/release-dist/provenance-*.json
          if-no-files-found: error
          retention-days: 1

  upload-assets:
    name: Attach release assets
    needs: [release-please, verify-ci, build]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Downloads, hashes, attests, and uploads; executes no project code, so it
    # is the only job holding id-token: write.
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: downloaded

      - name: Merge the platform archive sets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dists=(downloaded/*/)
          ((${#dists[@]} == 3)) || { echo "::error::expected three platform archive sets, found ${#dists[@]}"; exit 1; }
          scripts/assemble-dist.sh dist "${dists[@]}"

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Attach assets to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(awk '{ print "dist/" $2 }' dist/SHA256SUMS.txt)
          gh release upload "$TAG" "${files[@]}" dist/SHA256SUMS.txt dist/provenance-*.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify remote asset bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          provenance=()
          for file in dist/provenance-*.json; do
            provenance+=(--asset "$file")
          done
          bash .github/scripts/publish-release-draft.sh --verify-only \
            --checksums dist/SHA256SUMS.txt --asset dist/SHA256SUMS.txt "${provenance[@]}" --exact

      - name: Upload the manifest for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: |
            dist/SHA256SUMS.txt
            dist/provenance-*.json
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          path: dist

      - name: Verify remote assets and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          provenance=()
          for file in dist/provenance-*.json; do
            provenance+=(--asset "$file")
          done
          bash .github/scripts/publish-release-draft.sh --publish \
            --checksums dist/SHA256SUMS.txt --asset dist/SHA256SUMS.txt "${provenance[@]}" --exact
