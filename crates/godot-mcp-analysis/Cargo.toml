[package]
name = "godot-mcp-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Self-contained Godot/GDScript static-analysis layer (Tree-sitter GDScript, project/scene/resource semantics). Derived from MIT codegraph-rust behavior; no runtime dependency on that checkout. Never imports transport or UI."

