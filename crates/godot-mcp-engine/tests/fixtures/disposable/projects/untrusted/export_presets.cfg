; Godot's own export configuration. It is committed here because it is a real
; secret-bearing file shape: the export dialog stores Android keystore passwords
; and store credentials in `export_presets.cfg`, which is why the Godot manual
; recommends keeping it out of version control. A disposable copy must not carry
; it into an untrusted run.

[preset.0]

name="Android"
platform="Android"
runnable=true
export_path="build/fixture.apk"

[preset.0.options]

keystore/release="res://fixture.keystore"
keystore/release_user="godot-mcp-fixture"
keystore/release_password="godot-mcp fixture placeholder, not a password"
