# Drives the committed fake engine for this project: a gdUnit4 run that reports
# one failure and exits 100. gdUnit4 does not use exit 1 — RETURN_ERROR is 100
# and RETURN_WARNING (orphans only) is 101 — which is exactly why the exit
# assertion is per-framework rather than a single global "0 or 1" rule.
import=ok
test_output=test/gdunit4-fail.out
test_exit=100
test_sleep_ms=0
