[package]
name = "godot-mcp-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Versioned domain contracts, error taxonomy, provenance/confidence and capability manifests for godot-mcp. Lowest layer: never imports transport or UI."

[features]
default = []
# Test-only permit/fault-hook surfaces are gated so they never enter a release
# build. No transport/UI feature exists here by design.
test-hooks = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
