[package]
name = "godot-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Transport + kernel layer for godot-mcp: rmcp handler, capability policy, effect gateway, durable transaction journal, stdio (default) and optional authenticated single-instance HTTP."

# `qa-journal-foundation` is a NON-SHIPPING, test-only driver used by Todo 6's
# `journal_foundation` acceptance tests. It exercises the crate-private effect
# gateway and the durable journal through the test-hooks harness, including the
# fault-injection points that simulate termination before/after each phase fsync.
# Gated behind `test-hooks` via `required-features`, so it never enters a release
# archive and the release-graph audit excludes it by construction.
[[bin]]
name = "qa-journal-foundation"
path = "src/bin/qa-journal-foundation.rs"
required-features = ["test-hooks"]

[[bin]]
name = "qa-fake-game"
path = "src/bin/qa-fake-game.rs"
required-features = ["test-hooks"]

[features]
# stdio is always available and is the default transport. It needs exactly rmcp's
# `transport-io` feature (stdin/stdout async framing); no custom framing exists.
default = ["stdio"]
stdio = ["rmcp/transport-io"]
# Optional Streamable HTTP transport; invokes the same handler/kernel as stdio.
# `rmcp/transport-streamable-http-server` supplies the official Streamable HTTP
# tower service (POST/GET/DELETE, SSE, session manager, MCP-Protocol-Version
# validation); this crate mounts it on Axum and adds the staged-authentication
# shell.
http = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "rmcp/transport-streamable-http-server",
]
# Optional HTTP auth (Resource Server). Requires `http`.
auth = ["http", "dep:jsonwebtoken", "dep:reqwest"]
# Test-only permit / fault-hook surfaces; never enabled in a release build.
test-hooks = [
    "godot-mcp-domain/test-hooks",
    "godot-mcp-analysis/test-hooks",
    "godot-mcp-engine/test-hooks",
    "godot-mcp-bridge/test-hooks",
]

[dependencies]
godot-mcp-domain = { workspace = true }
godot-mcp-analysis = { workspace = true }
godot-mcp-engine = { workspace = true }
godot-mcp-bridge = { workspace = true }

rmcp = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "io-std", "net", "time", "sync", "macros"] }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustix = { workspace = true }
notify = { workspace = true }

# Optional HTTP transport.
axum = { workspace = true, optional = true, features = ["http1", "json", "tokio"] }
tower = { workspace = true, optional = true, features = ["util"] }
tower-http = { workspace = true, optional = true, features = ["limit", "timeout"] }
# The OS CSPRNG: the HTTP per-launch bearer secret and managed session IDs.
getrandom = { workspace = true }

# Optional HTTP auth.
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
godot-mcp-server = { path = ".", features = ["test-hooks", "http", "auth"] }
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { workspace = true }
rstest = { workspace = true }
assert_cmd = { workspace = true }
assert_fs = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
